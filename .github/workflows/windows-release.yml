name: Windows distributables

on:
  push:
    branches: [main]
    tags:
      - 'v2.0.0-alpha.*'
      - 'v2.0.0-beta.*'
    paths:
      - 'pom.xml'
      - 'src/**'
      - 'packaging/**'
      - 'package-windows.bat'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-2022

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Resolve version and package names
        shell: pwsh
        run: |
          [xml]$pom = Get-Content -Raw 'pom.xml'
          $version = [string]$pom.project.version
          if ($version -match 'beta\.(\d+)$') {
            $releaseTitle = "Sonic Candle 2.0 Beta $($Matches[1]).0"
          } elseif ($version -match 'alpha\.(\d+)$') {
            $releaseTitle = "Sonic Candle 2.0 Alpha $($Matches[1])"
          } else {
            $releaseTitle = "Sonic Candle $version"
          }
          "PROJECT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TITLE=$releaseTitle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "JAR_NAME=sonic-candle-$version.jar" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EXE_NAME=sonic-candle-$version-windows-x64.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Add WiX Toolset to PATH
        shell: pwsh
        run: |
          $wix = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          if (-not (Test-Path (Join-Path $wix 'candle.exe'))) {
            throw "WiX Toolset 3.14 is not available on this runner."
          }
          $wix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build executable JAR
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Build Windows EXE installer
        shell: pwsh
        run: ./packaging/package-windows.ps1 -SkipBuild

      - name: Verify distributables
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/$env:JAR_NAME")) {
            throw "Executable JAR was not generated."
          }
          if (-not (Test-Path "dist/windows/$env:EXE_NAME")) {
            throw "Windows EXE installer was not generated."
          }
          Get-Item "dist/$env:JAR_NAME", "dist/windows/$env:EXE_NAME" |
            Format-Table Name, Length

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonic-candle-${{ env.PROJECT_VERSION }}
          if-no-files-found: error
          path: |
            dist/${{ env.JAR_NAME }}
            dist/windows/${{ env.EXE_NAME }}

      - name: Publish versioned prerelease
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = "v$env:PROJECT_VERSION"
          $ErrorActionPreference = 'Continue'
          gh release view $releaseTag *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = 'Stop'
          if ($releaseExists) {
            Write-Host "Release $releaseTag already exists; keeping its published assets unchanged."
            exit 0
          }
          $notesFile = "packaging/RELEASE_NOTES_$env:PROJECT_VERSION.md"
          $releaseArgs = @(
            "release", "create", $releaseTag,
            "--target", $env:GITHUB_SHA,
            "--title", $env:RELEASE_TITLE,
            "--prerelease"
          )
          if (Test-Path $notesFile) {
            $releaseArgs += @("--notes-file", $notesFile)
          } else {
            $releaseArgs += "--generate-notes"
          }
          $releaseArgs += @(
            "dist/$env:JAR_NAME",
            "dist/windows/$env:EXE_NAME"
          )
          & gh @releaseArgs
